    <!-- 14.10.2026: значок вкладки — синяя «W», как в legacy (index.html:7);
         при переносе его не было, и у вкладки был пустой лист -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232563EB'/%3E%3Ctext x='50' y='72' font-family='Arial,Helvetica,sans-serif' font-size='62' font-weight='bold' fill='white' text-anchor='middle'%3EW%3C/text%3E%3C/svg%3E">
    <title>WowSpeak Team Management</title>

    <!--
      Тема применяется ДО первой отрисовки и до загрузки бандла. Иначе
      человек с тёмной темой видит вспышку белого на каждой загрузке
      страницы, и никакой React это исправить уже не может: к моменту его
      запуска светлый кадр уже показан.

      Скрипт намеренно синхронный, крошечный и без зависимостей.
      Ключ хранилища продублирован строкой, а не импортирован из
      theme.ts — импорт означал бы модуль, а модуль отложил бы исполнение
      до конца парсинга документа, то есть вернул бы ту же вспышку.
      При расхождении источник истины — THEME_STORAGE_KEY в src/theme/theme.ts.
    -->
    <script>
      try {
        var m = window.localStorage.getItem('wowspeak:theme');
        if (m === 'light' || m === 'dark' || m === 'cute') document.documentElement.setAttribute('data-theme', m);
      } catch (e) {
        /* приватное окно или заблокированные данные сайта — остаёмся на системной теме */
      }
    </script>

    <!-- Шрифты Nunito и Fredoka One — из сборки (src/styles/fonts.ts), не с Google Fonts:
